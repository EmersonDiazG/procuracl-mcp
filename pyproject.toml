[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "procura-cl-mcp"
version = "0.3.0"
description = "Typed MCP server for exploring Chilean public procurement opportunities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Emerson" }]
dependencies = [
  "chile-public-market-sdk==1.0.1",
  "httpx>=0.28,<1",
  "mcp[cli]>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "uv>=0.8,<1",
]

[project.scripts]
procura-cl-mcp = "procura_cl.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/procura_cl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["integration: exercises the MCP interface in process"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["procura_cl"]
